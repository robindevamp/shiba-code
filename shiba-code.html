const glyphs = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン[]();=<>".split("");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const img = new Image();
img.onload = start;
img.src = src;
function start() {
  const cell = 16;
  const cols = Math.ceil(canvas.width / cell);
  const rows = Math.ceil(canvas.height / cell);
  const grid = Array.from({length: cols}, () => Array.from({length: rows + 12}, () => glyphs[Math.random() * glyphs.length | 0]));
  let shift = 0;
  function tick() {
    ctx.drawImage(img, 0, 0);
    ctx.fillStyle = "rgba(0,0,0,0.42)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "14px monospace";
    shift++;
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.2) grid[c][Math.random() * grid[c].length | 0] = glyphs[Math.random() * glyphs.length | 0];
      for (let r = 0; r < rows; r++) {
        const x = c * cell, y = r * cell;
        const p = ctx.getImageData(x + 6, y + 6, 1, 1).data;
        if (p[0] + p[1] + p[2] < 28) continue;
        const head = (r + shift) % 8 === 0;
        ctx.fillStyle = head
          ? `rgb(${Math.min(255, p[0] + 110)},${Math.min(255, p[1] + 90)},${Math.min(255, p[2] + 60)})`
          : `rgb(${p[0]},${p[1]},${p[2]})`;
        ctx.fillText(grid[c][(r + shift) % grid[c].length], x, y + 12);
      }
    }
    requestAnimationFrame(tick);
  }
  // sample colors from the clean image once
  const still = document.createElement("canvas");
  still.width = canvas.width; still.height = canvas.height;
  const sctx = still.getContext("2d");
  sctx.drawImage(img, 0, 0);
  const colors = [];
  for (let c = 0; c < cols; c++) {
    colors[c] = [];
    for (let r = 0; r < rows; r++) {
      colors[c][r] = sctx.getImageData(c * cell + 6, r * cell + 6, 1, 1).data;
    }
  }
  function tickFast() {
    ctx.drawImage(img, 0, 0);
    ctx.fillStyle = "rgba(0,0,0,0.38)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "15px monospace";
    shift++;
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.18) grid[c][Math.random() * grid[c].length | 0] = glyphs[Math.random() * glyphs.length | 0];
      for (let r = 0; r < rows; r++) {
        const p = colors[c][r];
        if (p[0] + p[1] + p[2] < 36) continue;
        const head = (r + shift) % 8 === 0;
        ctx.fillStyle = head
          ? `rgb(${Math.min(255, p[0] + 110)},${Math.min(255, p[1] + 90)},${Math.min(255, p[2] + 60)})`
          : `rgb(${p[0]},${p[1]},${p[2]})`;
        ctx.fillText(grid[c][(r + shift) % grid[c].length], c * cell, r * cell + 12);
      }
    }
    requestAnimationFrame(tickFast);
  }
  tickFast();
}
